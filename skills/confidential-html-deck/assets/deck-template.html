<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network access at all: nothing in this file can load or send anything. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Deck title</title>

<!-- ═════════════════════════════════════════════════════════════════════════
     1. DECK VARIABLES — DUMMY VALUES ONLY
     Real values are never written into this file. Open the deck in a browser
     and use "Edit data" or "Import data". Real values then live only in that
     browser tab's memory and are gone when it is closed.
     ═════════════════════════════════════════════════════════════════════════ -->
<script type="application/json" id="deck-vars">
{
  "deck": "deck-id",
  "version": "1",
  "locale": "en-GB",
  "vars": {
    "client.name":      { "type": "text",           "label": "Client name",              "value": "Example Corp" },
    "report.date":      { "type": "date:long",      "label": "Report date",              "value": "2031-01-15" },
    "revenue.current":  { "type": "currency:EUR:0", "label": "Revenue, current period",  "value": 1234500 },
    "revenue.previous": { "type": "currency:EUR:0", "label": "Revenue, previous period", "value": 1098700 }
  }
}
</script>

<!-- ═════════════════════════════════════════════════════════════════════════
     2. DESIGN TOKENS — empty on purpose. Fill every value from the user's
     design brief for this deck; there is no house style to fall back on.
     The runtime's charts and badges read these names.
     ═════════════════════════════════════════════════════════════════════════ -->
<style id="deck-theme">
:root {
  /* surfaces and text     --bg  --ink  --ink-soft  --rule  --surface
     emphasis              --accent  --accent-ink  --pos  --neg
     charts                --chart-1 … --chart-6  --chart-muted  --chart-highlight
                           --chart-text  --chart-label  --chart-axis  --chart-radius
     type                  --font-body  --font-head  (system fonts or @font-face with a data: URI) */
}
</style>

<!-- ═════════════════════════════════════════════════════════════════════════
     3. LAYOUT AND COMPONENTS — written per deck from the design brief.
     The runtime already fixes each .slide at 1280×720 px (PowerPoint 16:9)
     with overflow hidden; everything else (type scale, grid, margins, tables,
     cards, footers) is defined here for this deck only.
     ═════════════════════════════════════════════════════════════════════════ -->
<style id="deck-layout">
</style>
</head>
<body>

<!-- ═════════════════════════════════════════════════════════════════════════
     4. SLIDES — every sensitive value is an EMPTY element with data-var.
     The runtime fills it. Never type a sensitive value into the markup.
     ═════════════════════════════════════════════════════════════════════════ -->
<main id="deck">

<section class="slide">
  <h1><span data-var="client.name"></span></h1>
  <p><span data-var="report.date"></span></p>
</section>

<section class="slide">
  <h2>Revenue</h2>
  <p><span data-var="revenue.current"></span> (<span data-var="revenue.growth"></span> vs. previous period)</p>
</section>

</main>

<!-- ═════════════════════════════════════════════════════════════════════════
     5. DECK LOGIC — derived values are computed from variables, never typed.
     ═════════════════════════════════════════════════════════════════════════ -->
<script id="deck-logic">
const DECK_LOGIC = {
  derived: {
    "revenue.growth": { type: "percent:1:+", label: "Revenue growth",
      calc: v => v["revenue.current"] / v["revenue.previous"] - 1 },
  },
  // afterRender(values, api) { /* optional custom rendering; use textContent, never innerHTML */ },
};
</script>

<!-- ═════════════════════════════════════════════════════════════════════════
     6. DECK RUNTIME — copy verbatim, do not edit per deck.
     ═════════════════════════════════════════════════════════════════════════ -->
<!-- DECK-RUNTIME:BEGIN -->
<style id="deck-runtime-style">

  --ui-frame-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 8px 30px rgba(0,0,0,.08);
  --ui-pop-shadow: 0 16px 40px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04); --ui-seg-shadow: 0 1px 2px rgba(0,0,0,.08);
  --ui-scheme: light; --ui-mark: linear-gradient(135deg, #ffffff, #ececec);

.deck-chrome {

  -webkit-font-smoothing: antialiased; letter-spacing: -0.003em; }

  transition: background .12s, color .12s, border-color .12s; }

.deck-chrome button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ui-bg), 0 0 0 4px var(--ui-blue); }

.deck-chrome .lvl-error { color: var(--ui-red); }
.deck-chrome .lvl-warn { color: var(--ui-amber); }

html, body { margin: 0; padding: 0; }
body { background-color: var(--ui-canvas); background-image: radial-gradient(var(--ui-dots) 1px, transparent 1px); background-size: 22px 22px; transition: background-color .2s; }
#deck { padding: 88px 0 64px; display: flex; flex-direction: column; align-items: center; gap: 44px; box-sizing: border-box; }
html.editing #deck { padding-right: var(--deck-editor-w, 0px); }
.slide-frame { position: relative; width: calc(1280px * var(--deck-scale, 1)); height: calc(720px * var(--deck-scale, 1)); flex: none;
  box-shadow: var(--ui-frame-shadow); }
.slide-frame::before { content: attr(data-label); position: absolute; left: 0; bottom: 100%; padding-bottom: 8px;
  font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ui-frame-label); letter-spacing: 0; }
.slide-frame > .slide { position: absolute; top: 0; left: 0; transform: scale(var(--deck-scale, 1)); transform-origin: top left; }
/* Sample-data badge: functional, also printed, so a sample PDF is never mistaken for a real one */
.slide-frame::after { content: "Sample data"; position: absolute; right: 10px; top: 10px; z-index: 5;
  font: 600 11px/1 system-ui, -apple-system, sans-serif; letter-spacing: .06em; text-transform: uppercase;
  color: #7a4f00; background: #fff3cf; border: 1px solid #e9c46a; padding: 5px 8px; border-radius: 3px; pointer-events: none;
  transform: scale(var(--deck-scale, 1)); transform-origin: top right; }

html[data-deck-state="real"] .slide-frame::after { display: none; }
html[data-deck-state="partial"] .is-dummy { outline: 1px dashed rgba(242,95,92,.75); outline-offset: 2px; }
.var-error { color: #c0392b !important; outline: 2px solid #c0392b; }

/* Toolbar */
#deck-ui { position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 1000; display: flex; align-items: center; gap: 4px;
  padding: 0 12px 0 16px; background: var(--ui-bar); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--ui-border); }

  display: grid; place-items: center; margin-right: 10px; color: var(--ui-fg-2); }

/* Check popover */

  box-shadow: var(--ui-pop-shadow); display: none; }

  font-weight: 500; padding: 10px 16px; }

/* Present mode: one slide, fitted to the screen */
html.presenting body { background: #000; overflow: hidden; }
html.presenting #deck-ui, html.presenting #deck-panel, html.presenting #deck-warning, html.presenting #deck-editor { display: none !important; }
html.presenting #deck { padding: 0 !important; height: 100vh; justify-content: center; gap: 0; }
html.presenting .slide-frame { display: none; box-shadow: none; }
html.presenting .slide-frame::before { display: none; }
html.presenting .slide-frame.current { display: block; }

/* Print / Save as PDF: one 1280×720 page per slide */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { background: #fff !important; background-image: none !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  #deck-ui, #deck-panel, #deck-drop, #deck-warning, #deck-editor { display: none !important; }
  #deck { padding: 0 !important; gap: 0 !important; display: block !important; }
  .slide-frame { width: 1280px !important; height: 720px !important; box-shadow: none !important; display: block !important;
    break-after: page; page-break-after: always; overflow: hidden; }
  .slide-frame::before { display: none !important; }
  .slide-frame:last-child { break-after: auto; page-break-after: auto; }
  .slide-frame > .slide { transform: none !important; }
  .slide-frame::after { transform: none !important; }
  .is-dummy, .var-error { outline: none !important; }
}
</style>
<script id="deck-runtime">
(() => {
  'use strict';
  const RUNTIME_VERSION = '1.3';
  const SLIDE_W = 1280, SLIDE_H = 720;
  const root = document.documentElement;

  // A file saved from the browser after rendering may contain real values. Detect it before we render.
  const savedFromBrowser = root.hasAttribute('data-deck-rendered');

  let spec;
  try { spec = JSON.parse(document.getElementById('deck-vars').textContent); }
  catch (e) { document.body.insertAdjacentHTML('afterbegin', '<p style="color:#fff;background:#b42318;padding:16px;font:16px system-ui">deck-vars block is not valid JSON</p>'); console.error(e); return; }
  const defs = spec.vars || {};
  const locale = spec.locale || 'en-GB';
  const logic = (typeof DECK_LOGIC !== 'undefined' && DECK_LOGIC) || {};
  const derivedDefs = logic.derived || {};

  let loaded = null;      // { values: {}, extra: {}, fileName }  — in memory only, never written to the file
  let importIssues = [];
  let renderIssues = [];
  let lastState = 'sample';
  let dirty = false;      // edits not yet exported

  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const isNum = x => typeof x === 'number' && Number.isFinite(x);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // ───────────── formatting ─────────────
  function parseType(t) {
    const parts = String(t || 'text').split(':');
    const o = { kind: parts[0], digits: null, signed: false, currency: null, style: null };
    for (const p of parts.slice(1)) {
      if (/^\d+$/.test(p)) o.digits = +p;
      else if (p === '+') o.signed = true;
      else if (/^[A-Z]{3}$/.test(p)) o.currency = p;
      else if (p) o.style = p;
    }
    return o;
  }
  const NUMERIC = new Set(['number', 'integer', 'percent', 'currency', 'compact']);
  const nfCache = new Map();
  function nf(opts) {
    const k = JSON.stringify(opts);
    if (!nfCache.has(k)) nfCache.set(k, new Intl.NumberFormat(locale, opts));
    return nfCache.get(k);
  }
  function parseISODate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (!m) return null;
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.getUTCMonth() === +m[2] - 1 ? d : null;
  }
  function format(value, type) {
    const t = parseType(type);
    if (value === null || value === undefined) return '–';
    if (t.kind === 'text') return String(value);
    if (t.kind === 'date') {
      const d = parseISODate(value);
      if (!d) return '⚠ ' + String(value);
      const style = t.style || 'medium';
      const opts = style === 'month' ? { month: 'long', year: 'numeric' }
                 : style === 'month-short' ? { month: 'short', year: 'numeric' }
                 : style === 'year' ? { year: 'numeric' }
                 : { dateStyle: style };
      return new Intl.DateTimeFormat(locale, Object.assign({ timeZone: 'UTC' }, opts)).format(d);
    }
    if (!isNum(value)) return '⚠';
    const signDisplay = t.signed ? 'exceptZero' : 'auto';
    const d = t.digits;
    switch (t.kind) {
      case 'integer': return nf({ maximumFractionDigits: 0, signDisplay }).format(value);
      case 'number':  return nf(d === null ? { maximumFractionDigits: 2, signDisplay } : { minimumFractionDigits: d, maximumFractionDigits: d, signDisplay }).format(value);
      case 'percent': return nf({ style: 'percent', minimumFractionDigits: d ?? 0, maximumFractionDigits: d ?? 0, signDisplay }).format(value);
      case 'compact': return nf({ notation: 'compact', maximumFractionDigits: d ?? 1, signDisplay }).format(value);
      case 'currency': {
        const currency = t.currency || spec.currency || 'EUR';
        if (t.style === 'compact') return nf({ style: 'currency', currency, notation: 'compact', maximumFractionDigits: d ?? 1, signDisplay }).format(value);
        return nf({ style: 'currency', currency, minimumFractionDigits: d ?? 2, maximumFractionDigits: d ?? 2, signDisplay }).format(value);
      }
      default: return String(value);
    }
  }

  // ───────────── validation ─────────────
  function validateValue(value, type, fields) {
    const t = parseType(type);
    if (t.kind === 'text') return typeof value === 'string' ? null : 'expected text (a string in quotes)';
    if (t.kind === 'date') return parseISODate(value) ? null : 'expected a date as "YYYY-MM-DD"';
    if (NUMERIC.has(t.kind)) return isNum(value) ? null : 'expected a plain number without quotes, units or thousands separators (e.g. 1250000.5)';
    if (t.kind === 'rows') {
      if (!Array.isArray(value)) return 'expected a list of rows: [ {…}, {…} ]';
      for (let i = 0; i < value.length; i++) {
        const r = value[i];
        if (!r || typeof r !== 'object' || Array.isArray(r)) return `row ${i + 1}: expected an object { … }`;
        for (const [f, ft] of Object.entries(fields || {})) {
          if (!has(r, f)) return `row ${i + 1}: missing field "${f}"`;
          const e = validateValue(r[f], ft);
          if (e) return `row ${i + 1}, field "${f}": ${e}`;
        }
      }
      return null;
    }
    return null;
  }

  // ───────────── values ─────────────
  // A value counts as "yours" only if it was loaded/entered AND differs from the sample value
  // (unless the variable sets "sampleCheck": false, e.g. small numbers that may legitimately match).
  function isOwn(k) {
    if (!loaded || !has(loaded.values, k)) return false;
    return defs[k].sampleCheck === false || !same(loaded.values[k], defs[k].value);
  }
  function currentValue(k) { return loaded && has(loaded.values, k) ? loaded.values[k] : defs[k].value; }

  function compute() {
    const values = {}, types = {}, dummy = new Set(), labels = {};
    for (const [k, d] of Object.entries(defs)) {
      types[k] = d.type; labels[k] = d.label || k;
      values[k] = currentValue(k);
      if (!isOwn(k)) dummy.add(k);
    }
    const derivedErrors = {};
    for (const [k, d] of Object.entries(derivedDefs)) {
      types[k] = d.type; labels[k] = d.label || k;
      const deps = new Set();
      const proxy = new Proxy(values, {
        get(target, prop) {
          if (typeof prop !== 'string') return undefined;
          deps.add(prop);
          if (!has(target, prop)) throw new Error(`uses unknown variable "${prop}"`);
          const v = target[prop];
          return Array.isArray(v) ? v.map(r => Object.assign({}, r)) : v;
        },
        set() { throw new Error('derived calculations must not change variables'); },
      });
      try {
        const r = d.calc(proxy);
        const err = validateValue(r, d.type, d.fields);
        if (err) throw new Error('result invalid (' + err + ') — check for division by zero or missing inputs');
        values[k] = r;
      } catch (e) { values[k] = null; derivedErrors[k] = e.message; }
      if ([...deps].some(x => dummy.has(x))) dummy.add(k);
    }
    return { values, types, dummy, labels, derivedErrors };
  }

  // ───────────── rendering ─────────────
  function render() {
    renderIssues = [];
    const c = compute();
    const { values, types, dummy, derivedErrors } = c;
    for (const [k, msg] of Object.entries(derivedErrors)) renderIssues.push(['error', `Derived <code>${esc(k)}</code>: ${esc(msg)}`]);
    const used = new Set();
    const known = k => { if (has(values, k)) { used.add(k); return true; } renderIssues.push(['error', `Slide uses undefined variable <code>${esc(k)}</code>`]); return false; };

    document.querySelectorAll('#deck [data-var]').forEach(el => {
      const k = el.dataset.var;
      el.classList.remove('var-error', 'is-dummy', 'is-pos', 'is-neg');
      if (!known(k)) { el.textContent = '⟨' + k + '⟩'; el.classList.add('var-error'); return; }
      const v = values[k];
      const failed = v === null && has(derivedErrors, k);
      el.textContent = failed ? '⚠' : format(v, el.dataset.format || types[k]);
      if (failed) el.classList.add('var-error');
      if (isNum(v) && v > 0) el.classList.add('is-pos');
      if (isNum(v) && v < 0) el.classList.add('is-neg');
      if (dummy.has(k)) el.classList.add('is-dummy');
    });

    for (const prop of ['width', 'height']) {
      document.querySelectorAll(`#deck [data-${prop}]`).forEach(el => {
        const k = el.dataset[prop];
        if (!known(k)) return;
        const v = values[k];
        el.style[prop] = isNum(v) ? (Math.max(0, Math.min(1, v)) * 100).toFixed(3) + '%' : '0%';
      });
    }

    document.querySelectorAll('#deck [data-rows]').forEach(host => {
      const k = host.dataset.rows;
      host.querySelectorAll(':scope > [data-rendered-row]').forEach(n => n.remove());
      const tpl = host.querySelector(':scope > template');
      if (!tpl) { renderIssues.push(['error', `data-rows="${esc(k)}" has no &lt;template&gt; child`]); return; }
      if (!known(k)) return;
      const rows = selectRows(values[k], host.dataset.sort, host.dataset.max);
      const fieldTypes = (defs[k] && defs[k].fields) || (derivedDefs[k] && derivedDefs[k].fields) || {};
      rows.forEach((row, i) => {
        const frag = tpl.content.cloneNode(true);
        frag.querySelectorAll('[data-field]').forEach(el => {
          const f = el.dataset.field;
          const v = row[f];
          el.textContent = format(v, el.dataset.format || fieldTypes[f] || 'text');
          if (isNum(v) && v < 0) el.classList.add('is-neg');
          if (isNum(v) && v > 0) el.classList.add('is-pos');
          if (dummy.has(k)) el.classList.add('is-dummy');
        });
        frag.querySelectorAll('[data-index]').forEach(el => { el.textContent = String(i + 1); });
        frag.querySelectorAll('[data-field-width]').forEach(el => {
          const v = row[el.dataset.fieldWidth];
          el.style.width = isNum(v) ? (Math.max(0, Math.min(1, v)) * 100).toFixed(3) + '%' : '0%';
        });
        [...frag.children].forEach(n => n.setAttribute('data-rendered-row', ''));
        host.appendChild(frag);
      });
    });

    document.querySelectorAll('#deck [data-chart]').forEach(el => {
      const d = chartData(el, values, types, known, dummy);
      el.querySelectorAll(':scope > svg[data-rendered-chart]').forEach(n => n.remove());
      if (!d) return;
      const kind = el.dataset.chart;
      const svg = kind === 'hbar' ? hbarChart(el, d) : kind === 'line' ? lineChart(el, d) : barChart(el, d);
      el.insertAdjacentHTML('beforeend', svg);
      el.classList.toggle('is-dummy', d.dummy);
    });

    if (typeof logic.afterRender === 'function') {
      try { logic.afterRender(Object.freeze(Object.assign({}, values)), { format, isDummy: k => dummy.has(k) }); }
      catch (e) { renderIssues.push(['error', 'afterRender failed: ' + esc(e.message)]); }
    }

    for (const k of Object.keys(defs)) {
      if (!used.has(k) && !usedInLogic(k)) renderIssues.push(['info', `Variable <code>${esc(k)}</code> is defined but not shown on any slide`]);
      if (loaded && has(loaded.values, k) && !isOwn(k)) renderIssues.push(['warn', `<code>${esc(k)}</code> (${esc(defs[k].label || '')}) still has the sample value`]);
    }

    const total = Object.keys(defs).length;
    const own = Object.keys(defs).filter(isOwn).length;
    lastState = own === 0 ? 'sample' : own === total ? 'real' : 'partial';
    root.setAttribute('data-deck-state', lastState);
    root.setAttribute('data-deck-rendered', '');
    numberSlides();
    updateUI(own, total);
  }

  function usedInLogic(k) {
    const src = (document.getElementById('deck-logic') || {}).textContent || '';
    return src.includes('"' + k + '"') || src.includes("'" + k + "'");
  }

  function selectRows(rows, sort, max) {
    if (!Array.isArray(rows)) return [];
    let out = rows.slice();
    if (sort) {
      const desc = sort.startsWith('-'), f = sort.replace(/^[-+]/, '');
      out.sort((a, b) => {
        const x = a[f], y = b[f];
        const r = (isNum(x) && isNum(y)) ? x - y : String(x).localeCompare(String(y), locale);
        return desc ? -r : r;
      });
    }
    if (max) out = out.slice(0, +max);
    return out;
  }

  // ───────────── charts (static SVG, no libraries; all colors come from the deck's tokens) ─────────────
  const C = {
    text: 'var(--chart-text, var(--ink, #000))', label: 'var(--chart-label, var(--ink-soft, #555))',
    axis: 'var(--chart-axis, var(--rule, #bbb))', muted: 'var(--chart-muted, #ccc)',
    hi: 'var(--chart-highlight, var(--accent, #000))', bg: 'var(--bg, #fff)', radius: 'var(--chart-radius, 0px)',
  };
  const FALLBACK = ['#222', '#666', '#999', '#444', '#888', '#bbb'];
  function color(i) { return `var(--chart-${(i % 6) + 1}, ${FALLBACK[i % 6]})`; }
  function splitList(s) {
    if (!s) return [];
    s = s.trim();
    if (s.startsWith('[')) { try { return JSON.parse(s).map(String); } catch (e) { return []; } }
    return s.split(',').map(x => x.trim());
  }
  function chartData(el, values, types, known, dummy) {
    let labels, series, names, type = el.dataset.format, isDummy = false;
    if (el.dataset.chartRows) {
      const k = el.dataset.chartRows;
      if (!known(k)) return null;
      const rows = selectRows(values[k], el.dataset.sort, el.dataset.max);
      const lf = el.dataset.labelField, vfs = splitList(el.dataset.valueField);
      labels = rows.map(r => String(r[lf] ?? ''));
      series = vfs.map(f => rows.map(r => r[f]));
      names = el.dataset.seriesNames ? splitList(el.dataset.seriesNames) : vfs;
      const fields = (defs[k] && defs[k].fields) || (derivedDefs[k] && derivedDefs[k].fields) || {};
      type = type || fields[vfs[0]] || 'number';
      isDummy = dummy.has(k);
    } else {
      const groups = (el.dataset.series || '').split('|').map(splitList).filter(g => g.length);
      if (!groups.length) { renderIssues.push(['error', 'Chart without data-series or data-chart-rows']); return null; }
      series = groups.map(g => g.map(k => known(k) ? values[k] : null));
      const lv = splitList(el.dataset.labelVars);
      labels = lv.length ? lv.map(k => known(k) ? format(values[k], types[k]) : '?')
             : el.dataset.labels ? splitList(el.dataset.labels) : groups[0];
      names = el.dataset.seriesNames ? splitList(el.dataset.seriesNames) : groups.map((g, i) => 'Series ' + (i + 1));
      type = type || types[groups[0][0]] || 'number';
      isDummy = groups.flat().concat(lv).some(k => dummy.has(k));
    }
    return { labels, series, names, type, dummy: isDummy };
  }
  let measureCtx = null;
  function fitLabel(text, maxW, fs, el) {
    text = String(text ?? '');
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    const cs = getComputedStyle(el);
    measureCtx.font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    const w = t => measureCtx.measureText(t).width;
    if (w(text) <= maxW) return { text, full: null };
    let lo = 0, hi = text.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (w(text.slice(0, mid).trimEnd() + '…') <= maxW) lo = mid; else hi = mid - 1; }
    return { text: text.slice(0, lo).trimEnd() + '…', full: text };
  }
  function labelText(attrs, label) {
    return `<text ${attrs}>${label.full ? `<title>${esc(label.full)}</title>` : ''}${esc(label.text)}</text>`;
  }
  function dims(el) {
    const cs = getComputedStyle(el);
    return { W: el.clientWidth || 600, H: el.clientHeight || 320, fs: parseFloat(cs.fontSize) || 15 };
  }
  function svgOpen(W, H, fs) {
    return `<svg data-rendered-chart xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;overflow:visible;font-family:inherit;font-size:${fs}px">`;
  }
  function isHi(hl, i, n) { return hl === 'last' ? i === n - 1 : hl === 'first' ? i === 0 : String(i + 1) === hl; }
  function legend(d, W, fs) {
    if (d.series.length < 2) return '';
    let x = W, out = '';
    for (let s = d.series.length - 1; s >= 0; s--) {
      const name = d.names[s] || '';
      x -= name.length * fs * 0.58 + fs * 1.6;
      out += `<rect x="${x}" y="0" width="${fs * 0.8}" height="${fs * 0.8}" style="fill:${color(s)}"/>` +
             `<text x="${x + fs * 1.1}" y="${fs * 0.75}" style="fill:${C.label}">${esc(name)}</text>`;
    }
    return out;
  }
  function barChart(el, d) {
    const { W, H, fs } = dims(el);
    const top = fs * (d.series.length > 1 ? 3.2 : 1.8), bottom = fs * 2.2;
    const all = d.series.flat().filter(isNum);
    const max = Math.max(0, ...all), min = Math.min(0, ...all), span = (max - min) || 1;
    const plotH = H - top - bottom;
    const y = v => top + (max - v) / span * plotH;
    const n = Math.max(1, d.labels.length), sN = d.series.length;
    const band = W / n, groupW = band * (sN > 1 ? 0.8 : 0.62), barW = groupW / sN;
    const hl = el.dataset.highlight;
    let out = svgOpen(W, H, fs) + legend(d, W, fs);
    for (let i = 0; i < n; i++) {
      for (let s = 0; s < sN; s++) {
        const v = d.series[s][i];
        if (!isNum(v)) continue;
        const x = i * band + (band - groupW) / 2 + s * barW;
        const y0 = y(0), y1 = y(v), ry = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0));
        const fill = hl && sN === 1 ? (isHi(hl, i, n) ? C.hi : C.muted) : color(s);
        out += `<rect x="${x + barW * 0.06}" y="${ry}" width="${barW * 0.88}" height="${h}" style="fill:${fill};rx:${C.radius}"/>`;
        const ty = v >= 0 ? ry - fs * 0.45 : ry + h + fs * 1.1;
        out += `<text x="${x + barW / 2}" y="${ty}" text-anchor="middle" style="fill:${C.text};font-weight:var(--chart-value-weight, 600)">${esc(format(v, d.type))}</text>`;
      }
      out += labelText(`x="${i * band + band / 2}" y="${H - fs * 0.5}" text-anchor="middle" style="fill:${C.label}"`, fitLabel(d.labels[i], band * 0.96, fs, el));
    }
    out += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:${C.axis};stroke-width:1.5"/>`;
    return out + '</svg>';
  }
  function hbarChart(el, d) {
    const { W, H, fs } = dims(el);
    const v0 = d.series[0] || [];
    const n = Math.max(1, d.labels.length);
    const labelW = W * (parseFloat(el.dataset.labelWidth) || 0.3);
    const valueW = fs * 6;
    const plotW = Math.max(10, W - labelW - valueW);
    const all = v0.filter(isNum), max = Math.max(0, ...all), min = Math.min(0, ...all), span = (max - min) || 1;
    const x = v => labelW + (v - min) / span * plotW;
    const rowH = H / n, barH = Math.min(rowH * 0.62, fs * 2.2);
    const hl = el.dataset.highlight;
    let out = svgOpen(W, H, fs);
    for (let i = 0; i < n; i++) {
      const cy = i * rowH + rowH / 2, v = v0[i];
      out += labelText(`x="${labelW - fs * 0.6}" y="${cy + fs * 0.35}" text-anchor="end" style="fill:${C.text}"`, fitLabel(d.labels[i], labelW - fs * 0.8, fs, el));
      if (!isNum(v)) continue;
      const xa = x(Math.min(0, v)), xb = x(Math.max(0, v));
      const fill = hl ? (isHi(hl, i, n) ? C.hi : C.muted) : color(0);
      out += `<rect x="${xa}" y="${cy - barH / 2}" width="${Math.max(1, xb - xa)}" height="${barH}" style="fill:${fill};rx:${C.radius}"/>`;
      out += `<text x="${xb + fs * 0.45}" y="${cy + fs * 0.35}" style="fill:${C.text};font-weight:var(--chart-value-weight, 600)">${esc(format(v, d.type))}</text>`;
    }
    if (min < 0) out += `<line x1="${x(0)}" x2="${x(0)}" y1="0" y2="${H}" style="stroke:${C.axis};stroke-width:1.5"/>`;
    return out + '</svg>';
  }
  function lineChart(el, d) {
    const { W, H, fs } = dims(el);
    const top = fs * (d.series.length > 1 ? 3.2 : 1.6), bottom = fs * 2.2, left = fs * 0.8, right = fs * 6.5;
    const all = d.series.flat().filter(isNum);
    let max = all.length ? Math.max(...all) : 1, min = all.length ? Math.min(...all) : 0;
    if (el.dataset.zero === 'true') { max = Math.max(0, max); min = Math.min(0, min); }
    else { const pad = (max - min) * 0.08 || Math.abs(max) * 0.1 || 1; max += pad; min -= pad; }
    const span = (max - min) || 1, n = Math.max(1, d.labels.length);
    const plotW = W - left - right, plotH = H - top - bottom;
    const x = i => left + (n === 1 ? plotW / 2 : i * plotW / (n - 1));
    const y = v => top + (max - v) / span * plotH;
    let out = svgOpen(W, H, fs) + legend(d, W, fs);
    out += `<line x1="${left}" x2="${left + plotW}" y1="${top + plotH}" y2="${top + plotH}" style="stroke:${C.axis};stroke-width:1.5"/>`;
    d.series.forEach((ser, s) => {
      const pts = ser.map((v, i) => isNum(v) ? [x(i), y(v)] : null);
      const path = pts.reduce((a, p, i) => p ? a + (a && pts[i - 1] ? ' L' : ' M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1) : a, '');

      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; drop.classList.remove('on');
      const f = [...e.dataTransfer.files].find(f => /\.json$/i.test(f.name)) || e.dataTransfer.files[0];
      if (f && (!dirty || confirm('Loading this file replaces the values you entered and have not exported. Continue?'))) readFile(f);
    });
    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  }
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  function readFile(f) { const r = new FileReader(); r.onload = () => importText(String(r.result), f.name); r.readAsText(f); }

  function updateUI(own, total) {
    const st = ui.querySelector('.deck-ui-state');
    const label = lastState === 'sample' ? 'Sample data' : lastState === 'real' ? `Your data · ${loaded.fileName}` : `Your data · ${own}/${total} values`;
    st.replaceChildren(h('span', { class: 'dot ' + lastState }), label);
    st.title = lastState === 'sample' ? 'Showing the sample values stored in this file' : 'Held in this browser tab only — not saved into the deck file';
    if (panel.classList.contains('open')) fillPanel();
    updateDirty();
  }
  function fillPanel() {
    const list = arr => arr.length ? '<ul>' + arr.map(([lvl, m]) => `<li class="lvl-${lvl}"><span>${m}</span></li>`).join('') + '</ul>' : '<p class="ok">Nothing to report.</p>';
    const errs = renderIssues.filter(i => i[0] !== 'info'), infos = renderIssues.filter(i => i[0] === 'info');
    panel.innerHTML = `<div class="p-head"><span class="p-title">Check</span><button class="b-icon deck-panel-close" title="Close"></button></div>
      <h4>Your data</h4>${loaded ? `<p>Source <code>${esc(loaded.fileName)}</code> · held in this tab only</p>` + list(importIssues) : '<p>No data loaded — showing sample values. Use <b>Edit data</b> to type your values, or <b>Import</b> to load a file.</p>'}
      <h4>Slides</h4>${list(errs)}
      ${infos.length ? '<h4>Notes</h4>' + list(infos) : ''}
      <h4>Deck</h4><p><code>${esc(spec.deck || '')}</code> · version ${esc(spec.version || '')} · ${esc(locale)} · runtime ${RUNTIME_VERSION}</p>`;
    const close = panel.querySelector('.deck-panel-close');
    close.append(icon('close'));
    close.onclick = () => panel.classList.remove('open');
  }
  function openPanel() { panel.classList.add('open'); fillPanel(); }
  function togglePanel() { panel.classList.toggle('open'); if (panel.classList.contains('open')) fillPanel(); }

  // ───────────── viewer light / dark mode (affects the viewer only, never the slides) ─────────────
  // Follows the system setting until the user picks one; only that UI preference is remembered.
  const THEME_KEY = 'deck-viewer-theme';
  const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let uiTheme = 'dark', themeChosen = false;
  function setUiTheme(t, chosen) {
    uiTheme = t === 'light' ? 'light' : 'dark';
    root.setAttribute('data-ui-theme', uiTheme);
    if (chosen) { themeChosen = true; try { localStorage.setItem(THEME_KEY, uiTheme); } catch (e) { /* storage unavailable: keep for this tab */ } }
    paintThemeButton();
  }
  function paintThemeButton() {
    const b = ui && ui.querySelector('[data-act=theme]');
    if (!b) return;
    const next = uiTheme === 'dark' ? 'light' : 'dark';
    b.replaceChildren(icon(next === 'light' ? 'sun' : 'moon'));
    b.title = `Switch to ${next} mode`;
    b.setAttribute('aria-label', b.title);
  }
  function initUiTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { saved = null; }
    if (saved === 'light' || saved === 'dark') { themeChosen = true; setUiTheme(saved, false); }
    else setUiTheme(systemDark && !systemDark.matches ? 'light' : 'dark', false);
    if (systemDark && systemDark.addEventListener) systemDark.addEventListener('change', e => { if (!themeChosen) setUiTheme(e.matches ? 'dark' : 'light', false); });
  }

  function printDeck() {
    if (lastState !== 'real') {
      const msg = lastState === 'sample' ? 'No data is loaded — the PDF will contain SAMPLE values. Continue?' : 'Some values are still SAMPLE values (marked on the slides). Continue?';
      if (!confirm(msg)) return;
    }
    window.print();
  }

  // ───────────── layout, numbering, present mode ─────────────
  let frames = [], current = 0;
  function wrapSlides() {
    document.querySelectorAll('#deck > .slide').forEach(s => {
      const f = document.createElement('div'); f.className = 'slide-frame';
      s.replaceWith(f); f.appendChild(s);
    });
    frames = [...document.querySelectorAll('#deck > .slide-frame')];
    frames.forEach((f, i) => f.setAttribute('data-label', 'Slide ' + (i + 1)));
  }
  function numberSlides() {
    frames.forEach((f, i) => f.querySelectorAll('.slide-num').forEach(n => { n.textContent = String(i + 1); }));
    document.querySelectorAll('#deck .slide-count').forEach(n => { n.textContent = String(frames.length); });
  }
  function fit() {
    let s;
    if (root.classList.contains('presenting')) s = Math.min(window.innerWidth / SLIDE_W, window.innerHeight / SLIDE_H);
    else {
      const edW = root.classList.contains('editing') && editor ? editor.offsetWidth : 0;
      root.style.setProperty('--deck-editor-w', edW + 'px');
      s = Math.min(1, (document.documentElement.clientWidth - edW - 48) / SLIDE_W);
    }
    root.style.setProperty('--deck-scale', String(Math.max(0.1, s)));
  }
  function show(i) {
    current = Math.max(0, Math.min(frames.length - 1, i));
    frames.forEach((f, j) => f.classList.toggle('current', j === current));
  }
  function present(i) {
    root.classList.add('presenting'); show(i); fit();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }
  function stopPresenting() { root.classList.remove('presenting'); fit(); frames[current]?.scrollIntoView({ block: 'center' }); }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && root.classList.contains('presenting')) stopPresenting(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    const p = root.classList.contains('presenting');
    if (!p && (e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) { present(visibleIndex()); return; }
    if (!p) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(current + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(current - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(frames.length - 1);
    else if (e.key === 'Escape') { if (document.fullscreenElement) document.exitFullscreen(); else stopPresenting(); }
  });
  document.addEventListener('click', e => {
    if (!root.classList.contains('presenting') || e.target.closest('a, button, .deck-chrome')) return;
    show(current + (e.clientX < window.innerWidth / 3 ? -1 : 1));
  });
  function visibleIndex() {
    const mid = window.innerHeight / 2;
    let best = 0, bestD = Infinity;
    frames.forEach((f, i) => { const r = f.getBoundingClientRect(); const d = Math.abs((r.top + r.bottom) / 2 - mid); if (d < bestD) { bestD = d; best = i; } });
    return best;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('beforeprint', () => { root.style.setProperty('--deck-scale', '1'); });
  window.addEventListener('afterprint', fit);

  // Read-only hook for automated checks.
  window.DeckRuntime = Object.freeze({
    version: RUNTIME_VERSION,
    state: () => lastState,
    dirty: () => dirty,
    issues: () => ({ import: importIssues.map(i => i.slice()), render: renderIssues.map(i => i.slice()) }),
    importText: (text, name) => importText(text, name || 'data.json'),
    format,
  });

  function init() {
    initUiTheme();
    wrapSlides();
    buildUI();
    fit();
    render();
    if (renderIssues.some(i => i[0] === 'error')) console.warn('Deck check:', renderIssues.map(i => i[1].replace(/<[^>]+>/g, '')));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<!-- DECK-RUNTIME:END -->
</body>
</html>
